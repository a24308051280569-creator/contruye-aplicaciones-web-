<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SkillStudio</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #121212; color: #fff; text-align: center; }
    header { background: #1f1f1f; padding: 15px; border-bottom: 2px solid #00e676; }
    nav { background: #2a2a2a; padding: 10px; }
    nav a { color: #aaa; margin: 0 10px; text-decoration: none; }
    main { background: #1f1f1f; max-width: 350px; margin: 20px auto; padding: 20px; border-radius: 8px; text-align: left; }
    input, select, button { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #444; background: #121212; color: #fff; border-radius: 4px; box-sizing: border-box; }
    button { background: #00e676; color: #000; border: none; font-weight: bold; cursor: pointer; }
    footer { padding: 15px; color: #777; font-size: 12px; }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <header>
    <h2 style="margin:0; color:#00e676;">SkillStudio</h2>
  </header>

  <!-- Navegación -->
  <nav>
    <a href="#">Inicio</a> | <a href="#">Cursos</a> | <a href="#">Contacto</a>
  </nav>

  <!-- Cuerpo -->
  <main>
    <h3 style="margin-top:0;">Registro rápido</h3>
    <form>
      <input type="text" placeholder="Nombre completo" required>
      <input type="email" placeholder="Correo electrónico" required>
      <select required>
        <option value="">Selecciona un curso</option>
        <option>Programación</option>
        <option>Diseño</option>
      </select>
      <button type="submit">Enviar</button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2026 SkillStudio.
  </footer>

</body>
</html>
